<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Glottal: open throat, airflow through vocal cords">
  <!-- Head outline -->
  <ellipse cx="100" cy="100" rx="80" ry="90" fill="#FFF5F0" stroke="#D1C4B8" stroke-width="2"/>
  <!-- Nose -->
  <ellipse cx="100" cy="78" rx="10" ry="7" fill="#FFCBB2" stroke="#D1997A" stroke-width="1.5"/>
  <circle cx="96" cy="80" r="2" fill="#BF6B52"/>
  <circle cx="104" cy="80" r="2" fill="#BF6B52"/>
  <!-- Open mouth (wide) -->
  <path d="M70 104 Q82 98 100 100 Q118 98 130 104" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Upper teeth -->
  <rect x="74" y="104" width="52" height="9" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Lower teeth -->
  <rect x="74" y="130" width="52" height="8" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Throat / glottis visible (open — highlighted) -->
  <ellipse cx="100" cy="120" rx="14" ry="12" fill="#FF6B6B" stroke="#BF3A2E" stroke-width="2"/>
  <!-- Vocal cord lines -->
  <line x1="92" y1="116" x2="92" y2="124" stroke="#BF3A2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="116" x2="108" y2="124" stroke="#BF3A2E" stroke-width="2" stroke-linecap="round"/>
  <!-- Open gap -->
  <line x1="100" y1="114" x2="100" y2="126" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Tongue resting low -->
  <path d="M55 162 Q72 150 86 145 Q100 142 115 144 Q122 146 124 152 Q118 158 104 160 Q84 164 65 164 Q58 163 55 162 Z" fill="#FFAB91" stroke="#BF6B52" stroke-width="1.5"/>
  <!-- Lower lip -->
  <path d="M70 138 Q82 144 100 145 Q118 144 130 138" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Airflow arrows from throat -->
  <path d="M100 108 L100 96" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3" fill="none"/>
  <polygon points="96,97 100,88 104,97" fill="#FF6B6B"/>
  <!-- Eyes -->
  <ellipse cx="76" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="78" cy="62" r="3" fill="#4A3728"/>
  <ellipse cx="124" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="126" cy="62" r="3" fill="#4A3728"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Open throat → breathe out</text>
</svg>
