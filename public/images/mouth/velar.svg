<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Velar: back of tongue to soft palate">
  <!-- Head outline -->
  <ellipse cx="100" cy="100" rx="80" ry="90" fill="#FFF5F0" stroke="#D1C4B8" stroke-width="2"/>
  <!-- Nose -->
  <ellipse cx="100" cy="78" rx="10" ry="7" fill="#FFCBB2" stroke="#D1997A" stroke-width="1.5"/>
  <circle cx="96" cy="80" r="2" fill="#BF6B52"/>
  <circle cx="104" cy="80" r="2" fill="#BF6B52"/>
  <!-- Palate arch -->
  <path d="M72 98 Q86 90 100 88 Q114 86 128 96" fill="none" stroke="#D1C4B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Soft palate (velar region — highlighted) -->
  <path d="M115 96 Q130 96 140 102 Q145 108 138 112 Q132 108 128 96 Z" fill="#FF6B6B" stroke="#BF3A2E" stroke-width="1.5"/>
  <!-- Upper lip -->
  <path d="M72 103 Q82 97 100 99 Q118 97 128 103" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Upper teeth -->
  <rect x="74" y="103" width="52" height="9" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Lower teeth -->
  <rect x="74" y="121" width="52" height="8" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Tongue body with raised back (highlighted) -->
  <path d="M50 165 Q64 152 76 148 Q90 142 104 138 Q118 132 128 126 Q136 118 138 112 Q144 116 140 126 Q132 140 116 148 Q96 158 72 164 Q60 166 50 165 Z" fill="#FF6B6B" stroke="#BF3A2E" stroke-width="1.5"/>
  <!-- Tongue front/mid (normal) -->
  <path d="M50 165 Q64 170 80 168 Q72 164 60 166 Z" fill="#FFAB91" stroke="#BF6B52" stroke-width="1"/>
  <!-- Air pressure arrow -->
  <path d="M142 112 L164 112" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" fill="none"/>
  <polygon points="164,108 172,112 164,116" fill="#FF6B6B"/>
  <!-- Lower lip -->
  <path d="M72 129 Q82 134 100 135 Q118 134 128 129" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="76" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="78" cy="62" r="3" fill="#4A3728"/>
  <ellipse cx="124" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="126" cy="62" r="3" fill="#4A3728"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Back tongue to soft palate</text>
</svg>
