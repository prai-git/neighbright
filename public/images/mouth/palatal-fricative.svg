<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Palatal fricative: tongue raised to palate">
  <!-- Head outline -->
  <ellipse cx="100" cy="100" rx="80" ry="90" fill="#FFF5F0" stroke="#D1C4B8" stroke-width="2"/>
  <!-- Nose -->
  <ellipse cx="100" cy="78" rx="10" ry="7" fill="#FFCBB2" stroke="#D1997A" stroke-width="1.5"/>
  <circle cx="96" cy="80" r="2" fill="#BF6B52"/>
  <circle cx="104" cy="80" r="2" fill="#BF6B52"/>
  <!-- Palate (highlighted) -->
  <path d="M72 98 Q100 90 128 98" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
  <!-- Upper lip (rounded) -->
  <path d="M72 102 Q82 96 100 98 Q118 96 128 102" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Upper teeth -->
  <rect x="74" y="102" width="52" height="9" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Lower teeth -->
  <rect x="74" y="120" width="52" height="8" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Tongue body raised (highlighted) -->
  <path d="M55 162 Q70 148 85 140 Q100 128 118 112 Q128 104 130 108 Q128 118 118 126 Q100 140 80 152 Q65 160 55 162 Z" fill="#FF6B6B" stroke="#BF3A2E" stroke-width="1.5"/>
  <!-- Air stream -->
  <path d="M132 112 L156 112" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" fill="none"/>
  <polygon points="156,108 164,112 156,116" fill="#FF6B6B"/>
  <!-- Rounded lip arrows -->
  <path d="M68 106 L55 106" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
  <path d="M132 106 L145 106" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
  <!-- Lower lip -->
  <path d="M72 128 Q82 133 100 134 Q118 133 128 128" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="76" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="78" cy="62" r="3" fill="#4A3728"/>
  <ellipse cx="124" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="126" cy="62" r="3" fill="#4A3728"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Tongue raised to palate</text>
</svg>
