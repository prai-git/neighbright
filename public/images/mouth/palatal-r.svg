<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Palatal R: tongue curled back (retroflex)">
  <!-- Head outline -->
  <ellipse cx="100" cy="100" rx="80" ry="90" fill="#FFF5F0" stroke="#D1C4B8" stroke-width="2"/>
  <!-- Nose -->
  <ellipse cx="100" cy="78" rx="10" ry="7" fill="#FFCBB2" stroke="#D1997A" stroke-width="1.5"/>
  <circle cx="96" cy="80" r="2" fill="#BF6B52"/>
  <circle cx="104" cy="80" r="2" fill="#BF6B52"/>
  <!-- Palate arch -->
  <path d="M72 98 Q86 90 100 88 Q114 86 128 96" fill="none" stroke="#D1C4B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Upper lip -->
  <path d="M72 102 Q82 96 100 98 Q118 96 128 102" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Upper teeth -->
  <rect x="74" y="102" width="52" height="9" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Lower teeth -->
  <rect x="74" y="120" width="52" height="8" rx="2" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
  <!-- Tongue curled back (retroflex tip highlighted) -->
  <path d="M55 165 Q70 152 82 145 Q95 135 108 130 Q118 128 124 132 Q120 142 110 148 Q95 156 78 162 Q65 166 55 165 Z" fill="#FFAB91" stroke="#BF6B52" stroke-width="1.5"/>
  <!-- Curled tip -->
  <path d="M108 130 Q116 122 120 115 Q118 110 112 112 Q106 120 108 130 Z" fill="#FF6B6B" stroke="#BF3A2E" stroke-width="1.5"/>
  <!-- Lower lip -->
  <path d="M72 128 Q82 133 100 134 Q118 133 128 128" fill="#FFAB91" stroke="#BF6B52" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="76" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="78" cy="62" r="3" fill="#4A3728"/>
  <ellipse cx="124" cy="61" rx="9" ry="6" fill="white" stroke="#D1C4B8" stroke-width="1"/>
  <circle cx="126" cy="62" r="3" fill="#4A3728"/>
  <!-- Label -->
  <text x="100" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Tongue tip curled back</text>
</svg>
